# Background work, run inside the Echo server by Solid Queue.
shared: &shared
  jira_sync:
    class: JiraSyncJob
    schedule: every minute
  github_sync:
    class: GithubSyncJob
    schedule: every minute
  notify:
    class: NotifyJob
    schedule: every 30 seconds
  retention:
    class: RetentionJob
    schedule: every hour

development:
  <<: *shared

production:
  <<: *shared
