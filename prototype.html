<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F4F7;--surface:#FFFFFF;--surface-2:#ECEEF3;--line:#DCE0E7;--line-2:#E8EBF0;
  --text:#151922;--muted:#596272;--faint:#8A92A0;
  --accent:#4F52C9;--accent-soft:#E7E8FA;
  --ok:#1E8A4C;--ok-soft:#E1F3E8;--warn:#A86511;--warn-soft:#FBEFD9;--bad:#C63D3D;--bad-soft:#FBE3E3;
  --jira:#1F6FE5;--gh:#24292F;--idle:#9AA1AD;
  --term-bg:#12141A;--term-text:#D6DAE2;
  --shadow:0 1px 2px rgba(20,24,34,.05),0 8px 24px rgba(20,24,34,.06);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1015;--surface:#161920;--surface-2:#1D212A;--line:#2A2F3A;--line-2:#222631;
  --text:#E5E8EE;--muted:#A0A8B6;--faint:#6F7786;
  --accent:#9497F5;--accent-soft:#262852;
  --ok:#4CC17E;--ok-soft:#17301F;--warn:#E6A547;--warn-soft:#352711;--bad:#EF7272;--bad-soft:#3A1B1B;
  --jira:#5C9DFF;--gh:#C9D1D9;--idle:#5F6674;
  --term-bg:#0A0B0F;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1015;--surface:#161920;--surface-2:#1D212A;--line:#2A2F3A;--line-2:#222631;
  --text:#E5E8EE;--muted:#A0A8B6;--faint:#6F7786;
  --accent:#9497F5;--accent-soft:#262852;
  --ok:#4CC17E;--ok-soft:#17301F;--warn:#E6A547;--warn-soft:#352711;--bad:#EF7272;--bad-soft:#3A1B1B;
  --jira:#5C9DFF;--gh:#C9D1D9;--idle:#5F6674;
  --term-bg:#0A0B0F;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}

.app{display:grid;grid-template-columns:208px 1fr;min-height:100%}
.nav{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 10px 16px;font-weight:600;letter-spacing:-.01em}
.brand-mark{width:18px;height:18px;border-radius:5px;background:var(--accent);position:relative}
.brand-mark::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:7px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-item .count{font:500 11.5px var(--mono);color:var(--faint)}
.nav-item[aria-current="page"] .count{color:var(--accent)}
.nav-sep{height:1px;background:var(--line-2);margin:10px 4px}
.nav-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--faint);display:grid;gap:6px}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}

.main{min-width:0;padding-inline:28px;padding-block:18px 48px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0;margin-right:auto;text-wrap:balance}
.sample{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:4px}
.live{display:flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px}
.live-status{display:flex;align-items:center;gap:7px;padding:3px 9px;font-size:12.5px;color:var(--muted)}
.live-btn{padding:4px 9px;border-radius:5px;font-size:12.5px;color:var(--muted)}
.live-btn:hover{background:var(--surface-2);color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none;display:inline-block}
.dot.busy,.dot.running,.dot.live{background:var(--ok)}
.dot.live{box-shadow:0 0 0 3px var(--ok-soft);animation:pulse 2s infinite}
.dot.paused{background:var(--warn)}
.dot.blocked{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot.stopped,.dot.failed{background:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 5px transparent}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.conns{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.conns span{display:flex;align-items:center;gap:5px}

.needs{border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));background:var(--surface);border-radius:10px;margin-bottom:18px;overflow:hidden}
.needs-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.needs-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line-2)}
.needs-row:hover{background:var(--surface-2)}
.needs-row .what{min-width:0}
.needs-row .what b{font-weight:500}
.needs-row .src{font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;padding:13px 16px 10px}
.panel-head h2{font-size:14.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.panel-head .viewall{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:500}
.panel-head .viewall:hover{text-decoration:underline}
.stats{display:flex;gap:22px;padding:0 16px 12px;flex-wrap:wrap}
.stat .v{font:500 18px var(--mono);letter-spacing:-.02em}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.sub-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:10px 16px 4px;display:flex;justify-content:space-between}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 16px;border-top:1px solid var(--line-2);text-align:left;width:100%}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{font-size:12px;color:var(--faint);white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .lead{padding-top:5px}
.row.unread .t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.ext::after{content:"↗";margin-left:4px;color:var(--faint);font-size:11px}

.pill{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--sans);padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.outline{background:none;border:1px dashed var(--line);color:var(--muted)}
.src-badge{font:600 10px var(--mono);letter-spacing:.03em;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.src-badge.jira{color:var(--jira);border-color:color-mix(in srgb,var(--jira) 40%,var(--line))}
.key{font:500 12px var(--mono);color:var(--jira)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.tab .count{font:12px var(--mono);color:var(--faint);margin-left:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fchip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}
.fsep{width:1px;height:18px;background:var(--line);margin:0 4px}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.group-row td{background:var(--bg);cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:7px 12px}
tbody tr.group-row:hover td{background:var(--bg)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#101125}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#101125}}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}

.scrim{position:fixed;inset:0;background:rgba(10,12,18,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{position:sticky;top:0;background:var(--surface);padding:16px 20px 12px;border-bottom:1px solid var(--line-2);display:grid;gap:8px;z-index:1}
.d-title{display:flex;align-items:center;gap:10px}
.d-title h3{margin:0;font:600 16px var(--mono);letter-spacing:-.01em}
.d-close{margin-left:auto;padding:4px 8px;border-radius:6px;color:var(--muted)}
.d-close:hover{background:var(--surface-2)}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.d-body{padding:14px 20px 28px;display:grid;gap:18px}
.d-sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.tile{background:var(--surface);padding:10px 12px}
.tile .v{font:500 16px var(--mono)}
.tile .l{font-size:11px;color:var(--faint)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 12px;color:var(--text);max-width:65ch}
.quote.you{border-color:var(--accent)}
.kv{display:grid;gap:1px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--line-2)}
.kv > div{background:var(--surface);padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.kv .sub{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.summary{background:var(--accent-soft);border-radius:8px;padding:12px 14px;max-width:65ch}
.summary .meta{font-size:11.5px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.spark{display:block;width:100%;height:44px}

.modal{position:fixed;z-index:30;inset:6vh 50% auto auto;transform:translateX(50%);width:min(820px,calc(100% - 32px));max-height:88vh;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35);border:1px solid var(--line);background:var(--surface)}
.m-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:13px}
.m-body{overflow-y:auto;padding:16px 18px;display:grid;gap:12px}
.msg{display:grid;gap:3px;max-width:70ch}
.msg .who{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.msg.user .body{color:var(--accent)}
.msg .tool{font:12px var(--mono);color:var(--muted);background:var(--surface-2);padding:6px 9px;border-radius:6px}
.term{background:var(--term-bg);color:var(--term-text);font:13px/1.55 var(--mono);padding:16px 18px;min-height:340px;white-space:pre-wrap;overflow:auto}
.term .g{color:#6FD39B}.term .d{color:#7C8494}.term .a{color:#A9ABFF}
.caret{display:inline-block;width:8px;height:15px;background:var(--term-text);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.settings{display:grid;gap:16px;max-width:760px}
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.set-card h2{margin:0;font-size:14.5px}
.set-card p{margin:0;color:var(--muted);max-width:65ch}
.member{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 4px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface)}
.member .x{width:18px;height:18px;border-radius:50%;color:var(--faint);line-height:1}
.member .x:hover{background:var(--bad-soft);color:var(--bad)}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font:600 9.5px var(--sans);color:#fff;flex:none}
.set-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.set-row:first-of-type{border-top:0}
.set-row .h{font-weight:500}.set-row .d{font-size:12.5px;color:var(--muted)}
input[type=text],select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text)}
.switch{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40}
.empty{padding:18px 16px;color:var(--faint);font-size:13px;border-top:1px solid var(--line-2)}

@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px 16px;border-right:0;border-bottom:1px solid var(--line);z-index:10;gap:2px}
  .brand{padding:6px 10px 6px 0}
  .nav-item{width:auto;white-space:nowrap}
  .nav-sep,.nav-foot{display:none}
  .main{padding-inline:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .conns{display:none}
}
</style>
<style>
.row{align-items:center}
.row .lead{padding-top:0}
.row .s{font-size:12px;color:var(--faint)}
.panel-head .cnt{font:500 12px var(--mono);color:var(--faint)}
.panel-head .badge{font:500 11.5px var(--sans);color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
.needs-row .what b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.why .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.facts b{font:500 13px var(--mono);color:var(--text);margin-right:4px}
.rv{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px}
.rv:first-child{border-top:0}
.rv .pill{margin-left:auto}
.ai{border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai .grow{flex:1;min-width:180px}
.ai .t{font-weight:500}
.ai .s{font-size:12px;color:var(--muted)}
.row .c{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 1px}
.row .c b{font-weight:500;color:var(--text)}
.row .c .pill{font-size:11px;padding:0 6px}
.d-title h3.plain{font:600 16px var(--sans);letter-spacing:-.01em;text-wrap:balance}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<style>body{margin:0}</style>
<style>
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line-2);text-align:left;width:100%}
.list > .row:first-child{border-top:0}
.row .lead{padding-top:1px;display:flex;align-items:center;min-height:20px}
.row .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .t{font-weight:500;white-space:normal;overflow:visible;text-overflow:clip;text-wrap:pretty;overflow-wrap:anywhere}
.row .c{display:block;font-size:13px;color:var(--muted);-webkit-line-clamp:unset;overflow:visible;margin:0;overflow-wrap:anywhere}
.row .c b{font-weight:500;color:var(--text)}
.row .c .pill{font-size:11px}
.row .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--faint);margin-top:2px}
.row .time{font-size:12px;color:var(--faint);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.arrow{color:var(--faint);margin:0 4px}
.d-title{flex-wrap:wrap}
.lede{margin:-6px 0 20px;color:var(--muted);font-size:15px;max-width:70ch;text-wrap:pretty}
.lede b{color:var(--text);font-weight:600}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.ov-main{display:grid;gap:28px;min-width:0}
.needs{margin:0;border-radius:12px}
.needs-head{padding:12px 16px}
.needs-head h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}

function waitingItems(){
  const out = [];
  agents.filter(a => a.needs).forEach(a => out.push({ id:`agent:${a.id}`, kind:'agent', ref:a.id, badge:'CC', what:a.needs, src:a.name, t:a.active }));
  ghNotifs.filter(n => ['review_requested','mention','changes_requested'].includes(n.reason)).forEach(n => out.push({ id:`gh:${n.id}`, kind:'gh', ref:n.id, badge:'GH', what:`${reasonLabel[n.reason]} · ${prBy(n.repo,n.n).title}`, src:n.reason==='changes_requested' ? `${n.actor} requested changes: “${n.body}”` : n.body ? `${n.actor}: “${n.body}”` : `${n.actor} asked you to review`, t:n.t, synced:n.resolved }));
  jiraNotifs.filter(n => n.kind==='mention' || n.kind==='assigned').forEach(n => out.push({ id:`jira:${n.id}`, kind:'jira', ref:n.id, badge:'JIRA', what:`${n.kind==='assigned'?'Assigned':'Mention on'} ${n.key} · ${n.title}`, src:n.kind==='assigned' ? `${n.actor} assigned it to you` : `${n.actor}: “${n.body}”`, t:n.t }));
  out.forEach(w => { const d = state.decisions[w.id]; w.status = d ? d.status : w.synced ? 'synced' : 'open'; w.decidedAt = d?.at; });
  return out.sort((a,b) => b.t - a.t);
}
const needsList = () => waitingItems().filter(w => w.status==='open');
const waitRow = w => `<button class="needs-row" data-wait="${w.id}"><span class="src-badge ${w.badge==='JIRA'?'jira':''}">${w.badge}</span><span class="what"><b>${esc(w.what)}</b><span class="src">${esc(w.src)}</span></span><span class="when">${w.status==='open' ? ago(w.t) : `<span class="pill ${w.status==='dismissed'?'':'ok'}">${w.status==='synced'?'Resolved':'Dismissed'}</span>`}</span></button>`;

function viewInbox(){
  const tab = state.tabs.inbox, f = state.filters;
  const all = waitingItems();
  const groups = { open: all.filter(w => w.status==='open'), resolved: all.filter(w => w.status==='synced'), dismissed: all.filter(w => w.status==='dismissed') };
  const feed = [...ghNotifs.map(n => ({ src:'gh', n, t:n.t, unread:n.unread })), ...jiraNotifs.map(n => ({ src:'jira', n, t:n.t, unread:n.unread }))].sort((a,b) => b.t - a.t);
  const unread = { all: feed.filter(x => x.unread).length, github: unreadCount(ghNotifs), jira: unreadCount(jiraNotifs) };
  const tabBtn = (v,l,c) => `<button class="tab" data-tab="inbox" data-val="${v}" aria-selected="${tab===v}">${l}${c?`<span class="count">${c}</span>`:''}</button>`;
  let body;
  if (tab==='waiting') {
    const chip = (v,l) => `<button class="fchip" data-filter="waitStatus" data-val="${v}" aria-pressed="${f.waitStatus===v}">${l} · ${groups[v].length}</button>`;
    body = `<div class="filters">${chip('open','Open')}${chip('resolved','Resolved')}${chip('dismissed','Dismissed')}</div>
      <section class="needs plain">${groups[f.waitStatus].map(waitRow).join('') || '<div class="empty">Nothing here.</div>'}</section>`;
  } else {
    const list = feed.filter(x => (tab==='all' || (tab==='github' ? x.src==='gh' : x.src==='jira')) && (!f.unreadOnly || x.unread));
    body = `<div class="filters"><button class="fchip" data-unread aria-pressed="${f.unreadOnly}">Unread only</button><button class="btn sm" data-markall="${tab}" style="margin-left:auto">Mark all read</button></div>
      <div class="block"><div class="list">${list.map(x => x.src==='gh' ? ghNotifRow(x.n) : jiraNotifRow(x.n)).join('') || '<div class="empty">No notifications.</div>'}</div></div>`;
  }
  return topbar('Notifications') + `<div class="tabs" role="tablist">${tabBtn('waiting','Waiting on you',groups.open.length)}${tabBtn('all','All',unread.all)}${tabBtn('github','GitHub',unread.github)}${tabBtn('jira','Jira',unread.jira)}</div>${body}`;
}

function topbar(title){
  const liveTxt = state.live==='live' ? `${Math.round((Date.now()-state.refreshed)/1000)}s ago` : state.live==='paused' ? 'Paused' : 'Stopped';
  return `<div class="topbar">
    <nav class="crumbs" aria-label="Breadcrumb"><button class="brand" data-view="overview"><span class="brand-mark"></span>Echo</button>${state.view!=='overview' ? `<span class="sep">/</span><h1>${title}</h1>` : ''}</nav>
    <span class="sample">Sample data</span>
    <div class="live" role="group" aria-label="Live updates">
      <span class="live-status"><i class="dot ${state.live}"></i><span id="live-txt" class="num">${liveTxt}</span></span>
      ${state.live==='live' ? `<button class="live-btn" data-live="paused">Pause</button>` : `<button class="live-btn" data-live="live">${state.live==='paused'?'Resume':'Start'}</button>`}
      ${state.live!=='stopped' ? `<button class="live-btn" data-live="stopped">Stop</button>` : ''}
      <span class="live-div" aria-hidden="true"></span>
      <button class="live-btn bell ${state.view==='inbox'?'on':''}" data-view="inbox" aria-label="Notifications, ${unreadCount(ghNotifs)+unreadCount(jiraNotifs)} unread"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.5a4 4 0 0 0-4 4v2.2L2.6 10.5c-.3.5.1 1 .6 1h9.6c.5 0 .9-.5.6-1L12 7.7V5.5a4 4 0 0 0-4-4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.3 13.2a1.8 1.8 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>${needsList().length ? `<span class="bell-n warn">${needsList().length}</span>` : ''}${unreadCount(ghNotifs)+unreadCount(jiraNotifs) ? `<span class="bell-n">${unreadCount(ghNotifs)+unreadCount(jiraNotifs)}</span>` : ''}</button>
      <button class="live-btn ${state.view==='settings'?'on':''}" data-view="settings" aria-label="Settings">⚙ Settings</button>
    </div>
  </div>`;
}

const transitionHTML = body => { const [a,b] = body.split(' → '); return `<span class="pill">${esc(a)}</span><span class="arrow">→</span><span class="pill accent">${esc(b)}</span>`; };

}[n.reason] ?? `“${esc(n.body)}”`);
const row = ({ attrs, lead, title, content='', meta='', time='', unread=false }) => `<button class="row ${unread?'unread':''}" ${attrs}>

    <span class="time">${time}</span>

const agentRow = a => row({ attrs:`data-agent="${a.id}"`, lead:`<i class="dot ${a.status}"></i>`, title:`<span class="mono">${a.name}</span>`,
  content: esc(a.needs || a.lastReply), meta: a.loops.length ? `<span class="pill">${a.loops.length} loop${a.loops.length>1?'s':''}</span>` : '', time: ago(a.active) });

  lead: mode==='mine' ? `<span class="src-badge">${p.draft?'DRAFT':'PR'}</span>` : avatar(p.author),
  title: esc(p.title),
  meta: `<span>${mode==='mine'?'':p.author+' · '}${p.repo}#${p.n}</span>` + (mode==='mine'

  time: ago(mode==='mine'?p.updated:p.opened) });
const ghNotifRow = n => { const p = prBy(n.repo, n.n); return row({ attrs:`data-pr="${n.repo}#${n.n}" data-from="${n.id}"`, unread:n.unread, lead:avatar(n.actor),
  title: esc(p.title), content:`<b>${n.actor}</b> ${ghContent(n,p)}`,

const jiraTicketRow = t => row({ attrs:`data-jira="${t.key}"`, lead:`<span class="key">${t.key}</span>`, title: esc(t.title),

  return jiraNotifs.find(x => x.id===w.ref).kind==='assigned' ? 'Clears when you move it out of To Do.' : 'Clears when you comment on the ticket.';

let audioCtx;
function chime(){
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const notes = { ping:[[1320,0]], chime:[[880,0],[1175,.12]], knock:[[220,0],[220,.14]] }[state.sound.tone];
    notes.forEach(([f, at]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + at;
      o.type = state.sound.tone==='knock' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.4);
    });
  } catch {}
}
function arrive(){
  if (state.live !== 'live') return;
  ghNotifs.unshift({ id:'g99', reason:'mention', repo:'web', n:26988, actor:'mchen', body:'@johnsalva can you sanity-check the page size?', t:Date.now(), unread:true });
  if (state.sound.when !== 'off') chime();
  toast('New mention from mchen');
  render();
}
function applyTheme(){
  if (state.theme==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = state.theme;
  try { localStorage.setItem('echo.theme', state.theme); } catch {}
}
function render(){
  const views = { overview:viewOverview, inbox:viewInbox, loops:viewLoops, agents:viewAgents, jira:viewJira, github:viewGithub, settings:viewSettings };
  document.getElementById('main').innerHTML = views[state.view]();
  const d = state.drawer, m = state.modal;
  const drawer = !d ? '' : d.type==='agent' ? agentDrawer(agents.find(x=>x.id===d.id)) : d.type==='jira' ? jiraDrawer(d.id, d.from) : d.type==='wait' ? waitDrawer(d.id) : prDrawer(d.id, d.from);
  const modal = !m ? '' : (m.type==='transcript' ? transcriptHTML : terminalHTML)(agents.find(x=>x.id===m.id));
  document.getElementById('overlay').innerHTML = drawer + modal;
}
function toast(msg){ const h = document.getElementById('toast-host'); h.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => h.innerHTML = '', 2200); }

function summaryFor(a){
  if (a.needs) return `Stopped until you answer: ${a.needs}.`;
  if (a.kind==='managed') return `Healthy. No errors in the last 24h.`;
  return `${a.lastReply}${a.loops.length?` Loop: ${a.loops[0].prompt} every ${a.loops[0].every}.`:''}`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-theme-set],[data-sound-set],[data-sound-tone],[data-sound-test],[data-agent],[data-pr],[data-jira],[data-wait],[data-decide],[data-close],[data-close-modal],[data-tab],[data-filter],[data-unread],[data-markall],[data-live],[data-summarize],[data-transcript],[data-terminal],[data-toast],[data-switch],[data-remove],[data-review]');
  if (!t) return;
  const d = t.dataset;
  if (d.view) { state.view = d.view; state.drawer = null; if (d.gtab) state.tabs.github = d.gtab; if (d.jtab) state.tabs.jira = d.jtab; if (d.itab) state.tabs.inbox = d.itab; window.scrollTo(0,0); }
  else if (d.agent) state.drawer = { type:'agent', id:d.agent };
  else if (d.themeSet) { state.theme = d.themeSet; applyTheme(); }
  else if (d.soundSet) { state.sound.when = d.soundSet; }
  else if (d.soundTone) { state.sound.tone = d.soundTone; chime(); }
  else if ('soundTest' in d) chime();
  else if (d.wait) state.drawer = { type:'wait', id:d.wait };
  else if (d.decide) { if (d.decide==='undo') delete state.decisions[d.id]; else state.decisions[d.id] = { status:d.decide, at:Date.now() }; saveDecisions(); if (d.decide!=='undo') { state.drawer = null; toast('Dismissed'); } }
  else if (d.jira) { state.drawer = { type:'jira', id:d.jira, from:d.jfrom }; const n = jiraNotifs.find(x => x.id===d.jfrom); if (n) n.unread = false; }
  else if (d.pr) { state.drawer = { type:'pr', id:d.pr, from:d.from }; const n = ghNotifs.find(x => x.id===d.from); if (n) n.unread = false; }
  else if ('close' in d) state.drawer = null;
  else if ('closeModal' in d) state.modal = null;
  else if (d.tab) state.tabs[d.tab] = d.val;
  else if (d.filter) state.filters[d.filter] = d.val;
  else if ('unread' in d) state.filters.unreadOnly = !state.filters.unreadOnly;
  else if (d.markall) { [...(d.markall!=='jira'?ghNotifs:[]), ...(d.markall!=='github'?jiraNotifs:[])].forEach(n => n.unread = false); toast('Marked all read'); }
  else if (d.live) state.live = d.live;
  else if (d.summarize) { state.summaries[d.summarize] = 'loading'; setTimeout(() => { state.summaries[d.summarize] = summaryFor(agents.find(x=>x.id===d.summarize)); render(); }, 1000); }
  else if (d.review) { state.reviews[d.review] = 'running'; toast('AI review started'); setTimeout(() => { state.reviews[d.review] = 'done'; render(); }, 2500); }
  else if (d.transcript) state.modal = { type:'transcript', id:d.transcript };
  else if (d.terminal) state.modal = { type:'terminal', id:d.terminal };
  else if (d.toast) toast(d.toast);
  else if (d.switch?.startsWith('repo:')) { const r = d.switch.slice(5); state.repos[r] = !state.repos[r]; if (!state.repos[r] && state.filters.queueRepo===r) state.filters.queueRepo = 'all'; }
  else if (d.switch) state.watchers[d.switch] = !state.watchers[d.switch];
  else if (d.remove) state.team = state.team.filter(m => m !== d.remove);
  render();
});
document.addEventListener('toggle', e => { const k = e.target.dataset?.side; if (k) state.side[k] = e.target.open; }, true);
document.addEventListener('change', e => { if (e.target.id==='repo-filter') { state.filters.queueRepo = e.target.value; render(); } });
document.addEventListener('input', e => { if (e.target.id==='ended-search') document.getElementById('ended-body').innerHTML = endedRows(e.target.value); });
document.addEventListener('submit', e => { if (e.target.id==='add-repo') { e.preventDefault(); const v = document.getElementById('repo-input').value.trim().replace(/^acme\//,''); if (v && !(v in state.repos)) { state.repos[v] = true; toast(`Watching ${v}`); } render(); } });
document.addEventListener('submit', e => { if (e.target.id==='add-member') { e.preventDefault(); const v = document.getElementById('member-input').value.trim(); if (v && !state.team.includes(v)) { state.team.push(v); toast(`Added ${v}`); } render(); } });

let gPressed = 0;
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key==='Escape') { if (state.modal) state.modal = null; else state.drawer = null; render(); return; }
  if (e.key==='g') { gPressed = Date.now(); return; }
  if (Date.now() - gPressed < 800) {
    const map = { l:'loops', i:'inbox', o:'overview', a:'agents', j:'jira', h:'github', s:'settings' };
    if (map[e.key]) { state.view = map[e.key]; state.drawer = null; render(); }
    gPressed = 0;
  }
});
setInterval(() => {
  if (state.live !== 'live') return;
  if (Date.now() - state.refreshed > 5000) state.refreshed = Date.now();
  const el = document.getElementById('live-txt');
  if (el) el.textContent = `${Math.round((Date.now()-state.refreshed)/1000)}s ago`;
}, 1000);
applyTheme();
render();
setTimeout(arrive, 20000);
</script>
</body></html>
